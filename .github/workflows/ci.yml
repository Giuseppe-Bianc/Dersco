name: CI / CD Workflow

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write


jobs:
  build-and-check:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Quality Gates & Tests
        run: ./gradlew check

      - name: Build Shadow JAR
        run: ./gradlew shadowJar

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dersco-application
          path: app/build/libs/*.jar
          if-no-files-found: warn

      - name: Generate JaCoCo coverage report
        # Produces app/build/reports/jacoco/test/jacocoTestReport.xml. Wired
        # into `check` already, but called explicitly so a future decoupling
        # from the quality-gate run does not silently drop coverage.
        run: ./gradlew jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: app/build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: Create GitHub Release
    needs: build-and-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Shadow JAR
        run: ./gradlew shadowJar

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
