name: CI / CD Workflow

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # necessario anche per l'eventuale futuro upload OIDC verso Codecov

jobs:
  build-and-check:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Codecov richiede la cronologia Git completa per individuare
          # correttamente il commit di base e calcolare il diff di copertura
          # (soprattutto nelle pull request). Uno shallow clone produce
          # confronti di copertura inaccurati o falliti.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Quality Gates & Tests
        run: ./gradlew check

      - name: Build Shadow JAR
        run: ./gradlew shadowJar

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dersco-application
          path: app/build/libs/*.jar
          if-no-files-found: warn

      - name: Generate JaCoCo coverage report
        # Produce app/build/reports/jacoco/test/jacocoTestReport.xml. Già
        # eseguito implicitamente da `check`, ma richiamato esplicitamente
        # affinché un eventuale disaccoppiamento futuro dal quality-gate
        # non elimini silenziosamente il report di copertura.
        run: ./gradlew jacocoTestReport

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests
          name: dersco-coverage
          fail_ci_if_error: true
          verbose: true

  release:
    name: Create GitHub Release
    needs: build-and-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Shadow JAR
        run: ./gradlew shadowJar

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}