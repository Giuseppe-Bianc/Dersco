# codecov.yml
# Riferimento ufficiale allo schema completo:
# https://docs.codecov.com/docs/codecov-yaml
#
# Validare sempre il file prima del commit con:
#   curl -X POST --data-binary @codecov.yml https://codecov.io/validate

codecov:
  # Il report di copertura viene processato solo se lo stato della CI
  # (workflow GitHub Actions) è terminato con successo, evitando di
  # pubblicare metriche relative a build fallite o incomplete.
  require_ci_to_pass: true
  max_report_age: false

  notify:
    # Attende che tutti gli upload attesi (in questo caso 1, dato il
    # singolo flag "unittests") siano arrivati prima di notificare
    # lo stato finale su GitHub, evitando notifiche premature.
    wait_for_ci: true

coverage:
  precision: 2      # due cifre decimali nelle percentuali riportate
  round: down       # arrotondamento per difetto, più conservativo
  range: "70...100" # intervallo colore rosso→verde nei report/badge

  status:
    project:
      default:
        target: auto        # confronta rispetto alla copertura del commit base
        threshold: 1%        # tollera una regressione massima dell'1%
        base: auto
        if_ci_failed: error  # se la CI fallisce, lo status Codecov è "error"
        informational: false # lo status BLOCCA la PR se non soddisfatto
        only_pulls: false
    patch:
      default:
        target: 80%          # il codice NUOVO/modificato deve avere >= 80% coverage
        threshold: 5%
        base: auto
        if_ci_failed: error
        informational: false

flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: unittests
      paths:
        - app/src/main
      carryforward: false

comment:
  layout: "header, diff, flags, components, tree, reach, footer"
  behavior: default
  require_changes: false   # commenta anche se la copertura non cambia
  require_base: false
  require_head: true       # richiede almeno il report della testa del branch
  hide_project_coverage: false

github_checks:
  annotations: true   # annotazioni inline sulle righe non coperte nella PR

ignore:
  - "app/src/test/**"
  - "**/build/**"
  - "**/generated/**"
  - "**/*Test.java"
  - "**/*Tests.java"